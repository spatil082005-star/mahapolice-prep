<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Background -->
  <rect width="400" height="320" fill="transparent"/>
  
  <!-- Wings Left -->
  <path d="M120 100 Q60 80 40 120 Q60 130 120 140" fill="#1e3a5f" opacity="0.9"/>
  <path d="M120 120 Q70 110 50 140 Q70 145 120 155" fill="#1e3a5f" opacity="0.7"/>
  <path d="M120 140 Q80 135 60 160 Q80 162 120 170" fill="#1e3a5f" opacity="0.5"/>
  
  <!-- Wings Right -->
  <path d="M280 100 Q340 80 360 120 Q340 130 280 140" fill="#1e3a5f" opacity="0.9"/>
  <path d="M280 120 Q330 110 350 140 Q330 145 280 155" fill="#1e3a5f" opacity="0.7"/>
  <path d="M280 140 Q320 135 340 160 Q320 162 280 170" fill="#1e3a5f" opacity="0.5"/>
  
  <!-- Shield Background -->
  <path d="M200 50 L290 90 L290 170 Q290 230 200 270 Q110 230 110 170 L110 90 Z" fill="#1e3a5f" stroke="#f59e0b" stroke-width="5"/>
  
  <!-- Shield Inner -->
  <path d="M200 60 L280 95 L280 165 Q280 220 200 255 Q120 220 120 165 L120 95 Z" fill="#2d5a87"/>
  
  <!-- Stars on top -->
  <text x="155" y="75" font-size="18" fill="#f59e0b">★</text>
  <text x="177" y="65" font-size="18" fill="#f59e0b">★</text>
  <text x="200" y="60" font-size="18" fill="#f59e0b">★</text>
  <text x="223" y="65" font-size="18" fill="#f59e0b">★</text>
  <text x="245" y="75" font-size="18" fill="#f59e0b">★</text>
  
  <!-- Police Officer Head -->
  <circle cx="200" cy="120" r="28" fill="#fbbf24"/>
  
  <!-- Police Cap -->
  <path d="M172 115 Q200 105 228 115 L228 105 Q200 95 172 105 Z" fill="#1e3a5f"/>
  <rect x="185" y="100" width="30" height="10" fill="#f59e0b" rx="3"/>
  <circle cx="200" cy="105" r="4" fill="#1e3a5f"/>
  
  <!-- Officer Face -->
  <circle cx="192" cy="118" r="2" fill="#1e3a5f"/>
  <circle cx="208" cy="118" r="2" fill="#1e3a5f"/>
  <path d="M195 128 Q200 132 205 128" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  
  <!-- Officer Body -->
  <rect x="175" y="148" width="50" height="60" fill="#1e3a5f" rx="8"/>
  
  <!-- Badge on chest -->
  <circle cx="200" cy="170" r="10" fill="#f59e0b"/>
  <text x="200" y="174" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">★</text>
  
  <!-- Small shield on badge -->
  <path d="M200 165 L205 168 L205 173 Q205 176 200 178 Q195 176 195 173 L195 168 Z" fill="#1e3a5f"/>
  
  <!-- Gun Left -->
  <rect x="85" y="175" width="45" height="10" fill="#374151" rx="3" transform="rotate(-25 107 180)"/>
  <rect x="90" y="187" width="18" height="25" fill="#374151" rx="3" transform="rotate(-25 99 199)"/>
  <circle cx="88" cy="178" r="3" fill="#6b7280"/>
  
  <!-- Gun Right -->
  <rect x="270" y="175" width="45" height="10" fill="#374151" rx="3" transform="rotate(25 292 180)"/>
  <rect x="292" y="187" width="18" height="25" fill="#374151" rx="3" transform="rotate(25 301 199)"/>
  <circle cx="312" cy="178" r="3" fill="#6b7280"/>
  
  <!-- Text SAKSHI.OS -->
  <text x="200" y="295" font-size="36" font-weight="900" fill="#1e3a5f" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" letter-spacing="2">SAKSHI</text>
  <text x="310" y="295" font-size="36" font-weight="900" fill="#f59e0b" text-anchor="middle" font-family="Arial Black, Arial, sans-serif">.OS</text>
  
  <!-- Subtitle -->
  <text x="200" y="312" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="3">POLICE &amp; PROTECTION</text>
</svg>
